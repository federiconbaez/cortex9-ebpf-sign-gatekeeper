[package]
name = "ebpf-sign-gatekeeper"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Userspace gate that verifies a signature + manifest of an eBPF object and scans its bytecode before bpf(BPF_PROG_LOAD)"
repository = "https://github.com/federiconbaez/cortex9-ebpf-sign-gatekeeper"
keywords = ["ebpf", "bpf", "signing", "security", "linux"]
categories = ["command-line-utilities", "os::linux-apis"]
authors = ["Federico Nicolas Báez Rizzo"]
default-run = "ebpf-sign-gatekeeper"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]

[lib]
name = "ebpf_sign_gatekeeper"
path = "src/lib.rs"

[[bin]]
name = "ebpf-sign-gatekeeper"
path = "src/main.rs"

[[bin]]
name = "gen-corpus"
path = "src/bin/gen_corpus.rs"
